<section class="mx-auto max-w-5xl p-6">
  <h1 class="text-2xl font-bold text-slate-900">Retos Angular · Semana 06</h1>
  <p class="mt-1 text-sm text-slate-600">Formularios Reactivos — un componente por tema.</p>

  <h2 class="mt-8 text-lg font-semibold text-slate-800">Formularios reactivos</h2>
  <div class="mt-3 grid grid-cols-1 gap-3 sm:grid-cols-2">
    @for (item of formularios; track item.ruta) {
      <a
        [routerLink]="item.ruta"
        class="rounded-xl border border-slate-200 p-4 shadow-sm transition hover:border-indigo-300 hover:shadow-md"
      >
        <h3 class="font-medium text-indigo-700">{{ item.titulo }}</h3>
        <p class="mt-1 text-sm text-slate-600">{{ item.descripcion }}</p>
      </a>
    }
  </div>
</section>
