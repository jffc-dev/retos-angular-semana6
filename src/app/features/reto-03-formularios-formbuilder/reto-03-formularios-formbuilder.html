<section class="mx-auto max-w-2xl p-6">
  <a routerLink="/" class="text-sm text-indigo-600 hover:underline">← Volver al inicio</a>
  <h2 class="mt-2 text-xl font-semibold text-slate-900">FormBuilder, grupo anidado y FormArray</h2>
  <p class="mt-1 text-sm text-slate-600">
    <code>fb.group(...)</code> en vez de <code>new FormControl()</code> repetido, más un
    <code>FormGroup</code> anidado (dirección) y un <code>FormArray</code> (teléfonos).
  </p>

  <form class="mt-6 flex flex-col gap-3 rounded-xl border border-slate-200 p-4 shadow-sm">
    <input class="rounded-lg border border-slate-300 px-3 py-2 text-sm" placeholder="Nombre" />
    <input class="rounded-lg border border-slate-300 px-3 py-2 text-sm" placeholder="Email" />

    <div class="grid grid-cols-1 gap-2 rounded-lg bg-slate-50 p-3 sm:grid-cols-2">
      <p class="col-span-full text-xs font-medium text-slate-500">direccion (FormGroup anidado)</p>
      <input class="rounded-lg border border-slate-300 px-3 py-2 text-sm" placeholder="Calle" />
      <input class="rounded-lg border border-slate-300 px-3 py-2 text-sm" placeholder="Ciudad" />
    </div>

    <div class="rounded-lg bg-slate-50 p-3">
      <p class="mb-2 text-xs font-medium text-slate-500">telefonos (FormArray)</p>
      <div class="mb-2 flex gap-2">
        <input
          class="flex-1 rounded-lg border border-slate-300 px-3 py-2 text-sm"
          placeholder="Teléfono 1"
        />
        <button
          type="button"
          class="rounded-lg border border-slate-300 px-3 text-sm text-slate-700 hover:bg-slate-100"
        >
          Quitar
        </button>
      </div>
      <button
        type="button"
        class="rounded-lg border border-dashed border-slate-300 px-3 py-1 text-xs text-slate-600 hover:bg-slate-100"
      >
        + Agregar teléfono
      </button>
    </div>
  </form>

  <div class="mt-4 rounded-lg bg-slate-50 p-3 text-xs">
    <p class="mb-1 font-medium text-slate-600">perfilForm.value</p>
    <pre class="overflow-x-auto"></pre>
  </div>
</section>
