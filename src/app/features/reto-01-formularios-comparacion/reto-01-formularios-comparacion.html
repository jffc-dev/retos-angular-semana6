<section class="mx-auto max-w-4xl p-6">
  <a routerLink="/" class="text-sm text-indigo-600 hover:underline">← Volver al inicio</a>
  <h2 class="mt-2 text-xl font-semibold text-slate-900">Template-driven vs Reactive Forms</h2>
  <p class="mt-1 text-sm text-slate-600">
    Mismo formulario (nombre + email), construido de las dos formas. La diferencia está en
    dónde vive la fuente de verdad: el HTML o el TypeScript.
  </p>

  <div class="mt-6 grid grid-cols-1 gap-6 sm:grid-cols-2">
    <div class="rounded-xl border border-slate-200 p-4 shadow-sm">
      <h3 class="font-medium text-slate-800">Template-driven <span class="text-xs text-slate-400">(ngModel)</span></h3>

      <form class="mt-3 flex flex-col gap-2">
        <input
          class="rounded-lg border border-slate-300 px-3 py-2 text-sm"
          name="nombre"
          placeholder="Nombre"
        />
        <input
          class="rounded-lg border border-slate-300 px-3 py-2 text-sm"
          name="email"
          placeholder="Email"
        />
      </form>
    </div>

    <div class="rounded-xl border border-slate-200 p-4 shadow-sm">
      <h3 class="font-medium text-slate-800">Reactive Forms <span class="text-xs text-slate-400">(FormGroup)</span></h3>

      <form class="mt-3 flex flex-col gap-2">
        <input
          class="rounded-lg border border-slate-300 px-3 py-2 text-sm"
          placeholder="Nombre"
        />
        <input
          class="rounded-lg border border-slate-300 px-3 py-2 text-sm"
          placeholder="Email"
        />
      </form>
    </div>
  </div>
</section>
