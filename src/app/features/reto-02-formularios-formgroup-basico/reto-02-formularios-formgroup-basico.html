<section class="mx-auto max-w-2xl p-6">
  <a routerLink="/" class="text-sm text-indigo-600 hover:underline">← Volver al inicio</a>
  <h2 class="mt-2 text-xl font-semibold text-slate-900">FormControl y FormGroup a mano</h2>
  <p class="mt-1 text-sm text-slate-600">
    Sin FormBuilder: cada campo se crea con <code>new FormControl()</code> y se agrupan con
    <code>new FormGroup()</code>. Es más código, pero deja ver qué hace FormBuilder por debajo.
  </p>

  <form class="mt-6 flex flex-col gap-3 rounded-xl border border-slate-200 p-4 shadow-sm">
    <input class="rounded-lg border border-slate-300 px-3 py-2 text-sm" placeholder="Nombre" />
    <input class="rounded-lg border border-slate-300 px-3 py-2 text-sm" placeholder="Email" />

    <div class="flex gap-2">
      <button
        type="button"
        class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700"
      >
        checkoutForm.patchValue(...)
      </button>
      <button
        type="button"
        class="rounded-lg border border-slate-300 px-4 py-2 text-sm text-slate-700 hover:bg-slate-50"
      >
        checkoutForm.reset()
      </button>
    </div>
  </form>

  <div class="mt-4 grid grid-cols-1 gap-3 sm:grid-cols-2">
    <div class="rounded-lg bg-slate-50 p-3 text-xs">
      <p class="mb-1 font-medium text-slate-600">checkoutForm.value</p>
      <pre class="overflow-x-auto"></pre>
    </div>
    <div class="rounded-lg bg-slate-50 p-3 text-xs">
      <p class="mb-1 font-medium text-slate-600">Último valor recibido por valueChanges</p>
      <pre class="overflow-x-auto"></pre>
    </div>
  </div>
</section>
